<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause instead of cancel — {{ product }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="card survey">
    <h1>Need a break, not a goodbye?</h1>
    <p>Pause your subscription for 1–3 months. You keep all your data, pay nothing while paused, and pick up right where you left off.</p>
    <form method="post" action="/pause/{{ token }}">
      <fieldset>
        <legend>How long?</legend>
        <label class="radio"><input type="radio" name="months" value="1" required> 1 month</label>
        <label class="radio"><input type="radio" name="months" value="2"> 2 months</label>
        <label class="radio"><input type="radio" name="months" value="3"> 3 months</label>
      </fieldset>
      <button class="btn btn-big" type="submit">Pause my subscription</button>
    </form>
    <p class="muted small">No thanks — <a href="/s/{{ token }}">I'd rather just leave feedback</a>.</p>
  </div>
</div>
</body>
</html>
